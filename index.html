<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
</head>
<body>

    <div class="container">
 <h1>World Clock</h1>  
   
 <select id="cities">
<option value="">Select a City</option>
<option value="Europe/Amsterdam">Amsterdam</option>
<option value="America/Bogota">Bogota</option>
<option value="Asia/Tokyo">Tokyo</option>
</select>

<div id="city">
<div class="city" id="nairobi" >
    <div>
<h2>Nairobi</h2>
<div class="date">Friday, 05 June 2026</div>
    </div>
<div class="time">1:48:15 <small>AM</small></div>
</div>

<div class="city" id="bangkok">
    <div>
<h2>Bangkok</h2>
<div class="date">Friday, 05 June 2026</div>
    </div>
<div class="time">1:48:15 <small>AM</small></div>
</div>
</div>

    </div>
    <footer>
    This project was coded by <strong>Erica Mbiti</strong> and is <a href="https://github.com/EricaMbiti/world-clock" target="_blank">open-sourced on github</a>
</footer>
<script src="index.js"></script>
</body>
</html>
